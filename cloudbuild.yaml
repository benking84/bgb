# Draft for review. Stories 8.3 and 8.5: pull request path and main path.
#
# One file, two modes chosen by the _MODE substitution.
#   pr   : install locked dependencies, run tests and checks, build the image without pushing.
#   main : no tests (they ran on the PR, and branch protection requires the bgb-pr check).
#          Builds the image once, pushes it tagged by commit SHA, reads its digest and creates
#          a Cloud Deploy release that references the image by digest.
#
# Any failing command fails the build. Each step skips itself unless it belongs to the mode.

substitutions:
  _MODE: main
  _REGION: australia-southeast1

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s

steps:
  # Fails the build on any _MODE other than pr or main. Without it a mistyped value would skip
  # every step and report a green PR check. Uses the uv image below, which the next step pulls anyway.
  - id: validate-mode
    name: ghcr.io/astral-sh/uv:0.13.6-python3.12-trixie-slim
    entrypoint: bash
    args:
      - -c
      - |
        case "${_MODE}" in
          pr|main) echo "_MODE=${_MODE}" ;;
          *) echo "Invalid _MODE=${_MODE}: expected pr or main"; exit 1 ;;
        esac

  # Runs before any install, build or push so a misconfigured trigger can never push or release.
  # PR builds skip it: they never push. A main build fails unless both _MODE and the branch are main.
  - id: guard-release
    name: ghcr.io/astral-sh/uv:0.13.6-python3.12-trixie-slim
    entrypoint: bash
    args:
      - -c
      - |
        if [ "${_MODE}" = "pr" ]; then echo "Skipping guard-release: _MODE=${_MODE}"; exit 0; fi
        if [ "${_MODE}" != "main" ] || [ "$BRANCH_NAME" != "main" ]; then
          echo "Refusing to release: _MODE=${_MODE} BRANCH_NAME=$BRANCH_NAME (both must be main)"
          exit 1
        fi
        echo "guard-release passed"

  # uv image pinned to the uv version in use locally (0.13.6) on Python 3.12, which matches the
  # Dockerfile runtime. --locked fails the build if uv.lock disagrees with pyproject.toml.
  - id: install-deps-python
    name: ghcr.io/astral-sh/uv:0.13.6-python3.12-trixie-slim
    entrypoint: bash
    args:
      - -c
      - |
        if [ "${_MODE}" != "pr" ]; then echo "Skipping install-deps-python: _MODE=${_MODE}"; exit 0; fi
        uv sync --locked --extra dev

  # Node 22 matches the web build stage in the Dockerfile. npm ci installs exactly what
  # web/package-lock.json records and fails if package.json disagrees.
  - id: install-deps-web
    name: node:22.12.0-bookworm-slim
    dir: web
    entrypoint: bash
    args:
      - -c
      - |
        if [ "${_MODE}" != "pr" ]; then echo "Skipping install-deps-web: _MODE=${_MODE}"; exit 0; fi
        npm ci

  # Same uv image as install-deps-python so the virtualenv in /workspace/.venv is reusable.
  - id: test-pr-only
    name: ghcr.io/astral-sh/uv:0.13.6-python3.12-trixie-slim
    entrypoint: bash
    args:
      - -c
      - |
        if [ "${_MODE}" != "pr" ]; then echo "Skipping test-pr-only: _MODE=${_MODE}"; exit 0; fi
        set -euo pipefail
        uv run --locked --extra dev pytest
        uv run --locked --extra dev ruff check src tests
        uv run --locked --extra dev ruff format --check src tests

  # Same Node image as install-deps-web so node_modules is reusable. Lint and build mirror the
  # Dockerfile web stage; NEXT_PUBLIC_API_BASE is empty there too.
  - id: test-pr-only-web
    name: node:22.12.0-bookworm-slim
    dir: web
    entrypoint: bash
    env:
      - NEXT_PUBLIC_API_BASE=
    args:
      - -c
      - |
        if [ "${_MODE}" != "pr" ]; then echo "Skipping test-pr-only-web: _MODE=${_MODE}"; exit 0; fi
        set -euo pipefail
        npm run lint
        npm run build

  # Official Terraform image pinned to the version in use locally (1.14.6). The image is Alpine,
  # so the shell is sh. init skips the backend so no state or credentials are needed.
  - id: test-pr-only-terraform
    name: hashicorp/terraform:1.14.6
    dir: terraform
    entrypoint: sh
    args:
      - -c
      - |
        if [ "${_MODE}" != "pr" ]; then echo "Skipping test-pr-only-terraform: _MODE=${_MODE}"; exit 0; fi
        set -eu
        terraform fmt -check
        terraform init -backend=false -input=false
        terraform validate

  # Google's Docker builder, pinned to an exact tag. The image is built once. On a PR it is only
  # checked and never pushed. On main it is tagged by commit SHA (never latest) and pushed.
  - id: build-image
    name: gcr.io/cloud-builders/docker:24.0.9
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_MODE}" = "pr" ]; then
          docker build --tag bgb:pr-check .
          exit 0
        fi
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/bgb/bgb:${COMMIT_SHA}"
        docker build --tag "$$IMAGE" .
        docker push "$$IMAGE"

  # Reads the digest the registry assigned at push, so the release deploys exactly what was pushed.
  # The file is shared with the next step through /workspace. Same Docker builder as build-image.
  - id: read-digest
    name: gcr.io/cloud-builders/docker:24.0.9
    entrypoint: bash
    args:
      - -c
      - |
        if [ "${_MODE}" != "main" ]; then echo "Skipping read-digest: _MODE=${_MODE}"; exit 0; fi
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/bgb/bgb:${COMMIT_SHA}"
        REF=$$(docker inspect --format '{{index .RepoDigests 0}}' "$$IMAGE")
        DIGEST="$${REF##*@}"
        case "$$DIGEST" in
          sha256:*) ;;
          *) echo "Unexpected digest: $$DIGEST"; exit 1 ;;
        esac
        echo "$$DIGEST" > /workspace/image-digest
        echo "Digest: $$DIGEST"

  # Google Cloud SDK image pinned to an exact version; gcloud deploy is part of the core SDK.
  # Two merges close together make two builds and two releases (names differ by SHORT_SHA).
  # Cloud Deploy queues rollouts per target in release order, so the later release lands last.
  - id: create-release
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:591.0.0-slim
    entrypoint: bash
    args:
      - -c
      - |
        if [ "${_MODE}" != "main" ]; then echo "Skipping create-release: _MODE=${_MODE}"; exit 0; fi
        set -euo pipefail
        DIGEST=$$(cat /workspace/image-digest)
        gcloud deploy releases create "sha-${SHORT_SHA}" \
          --delivery-pipeline=bgb \
          --region="${_REGION}" \
          --project="${PROJECT_ID}" \
          --source=deploy \
          --images="bgb=${_REGION}-docker.pkg.dev/${PROJECT_ID}/bgb/bgb@$$DIGEST" \
          --annotations="commit-sha=${COMMIT_SHA},build-id=${BUILD_ID}"
